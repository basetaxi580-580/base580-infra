name: Deploy infra

on:
  push:
    branches:
      - main
    paths:
      - 'docker-compose.yml'
      - 'README.md'
      - 'env.example'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: infra-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sync infra repo on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 35m
          script: |
            set -e
            cd ~/base580-infra
            git fetch origin main
            git reset --hard origin/main
            sudo bash scripts/deploy.sh all
